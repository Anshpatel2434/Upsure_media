version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      payload:
        patterns: ["payload", "@payloadcms/*"]
      tooling:
        patterns: ["eslint*", "prettier*", "husky", "lint-staged", "@commitlint/*", "typescript"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
